[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify, async pitfalls
select = ["F", "E", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "B008",   # FastAPI's Depends()/File() in argument defaults is the framework's intended style
    "SIM105", # explicit try/except/pass is clearer than contextlib.suppress in cleanup code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^eval/"]
