[pytest]
filterwarnings =
    # Raised inside the Stripe SDK's own HTTP client, not by this code.
    ignore:Use 'content=<...>' to upload raw bytes/text content.:DeprecationWarning
    # Starlette's test client suggests a newer HTTP library; the tests behave the same either way.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
